name: Validate SQLite foundation

on:
  push:
    branches:
      - 'storage/**'
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'scripts/sqliteDryRunMigration.ts'
      - 'src/server/db/**'
      - 'tests/sqlite*.test.ts'
      - 'tests/storageIntegrity.test.ts'
      - '.github/workflows/sqlite-foundation.yml'
  pull_request:
    branches:
      - main
      - 'audit/**'
      - 'storage/**'
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'scripts/sqliteDryRunMigration.ts'
      - 'src/server/db/**'
      - 'tests/sqlite*.test.ts'
      - 'tests/storageIntegrity.test.ts'
      - '.github/workflows/sqlite-foundation.yml'

permissions:
  contents: read

jobs:
  sqlite-foundation:
    name: SQLite tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0
          - os: windows-latest
            node: 24.22.2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js with built-in SQLite
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate runtime versions
        run: |
          node --version
          bun --version
      - name: Run financial storage and SQLite tests
        run: bun run test:storage
      - name: Validate TypeScript
        run: bun run lint
      - name: Build production frontend
        run: bun run build
