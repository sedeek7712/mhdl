    <script>
      (function() {
        // AI Studio Environment Constraint: HMR is disabled. Ignore and silence WebSocket errors.
        if (typeof window !== 'undefined') {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
                var dummy = new EventTarget();
                dummy.readyState = 1;
                dummy.url = url;
                dummy.protocol = protocols || '';
                dummy.send = function() {};
                dummy.close = function() {};
                setTimeout(function() {
                  dummy.dispatchEvent(new Event('open'));
                }, 0);
                return dummy;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (
              String(event.reason.message || event.reason).indexOf('WebSocket') !== -1
            )) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });

          window.addEventListener('error', function(event) {
            if (
              String(event.message || '').indexOf('WebSocket') !== -1 ||
              String(event.filename || '').indexOf('@vite/client') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });

          var origError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var str = args.map(function(a) {
              return typeof a === 'string' ? a : (a && a.message) || '';
            }).join(' ');
            if (
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('[vite] failed to connect to websocket') !== -1
            ) {
              return;
            }
            origError.apply(console, args);
          };
        }
      })();
    </script>
