<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Shield Badge -->
  <path d="M256 64 C350 64 416 110 416 200 C416 330 256 432 256 448 C256 448 96 330 96 200 C96 110 162 64 256 64 Z" 
        fill="#0f172a" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Inner Geometric Pattern -->
  <circle cx="256" cy="224" r="105" fill="#022c22" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="12 6"/>
  
  <!-- Arabic / Exchange Currency Motif: Two curved arrows representing exchange -->
  <path d="M190 190 A 75 75 0 0 1 320 180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="328,165 342,188 318,194" fill="url(#goldGrad)"/>

  <path d="M322 258 A 75 75 0 0 1 192 268" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="184,283 170,260 194,254" fill="url(#emeraldGrad)"/>

  <!-- Center Monogram 'ع' & 'ن' (Amro Alnamari) -->
  <circle cx="256" cy="224" r="32" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="256" y="235" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">ع</text>

  <!-- Brand Title at Bottom of Shield -->
  <text x="256" y="375" font-family="'Cairo', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">الـنـمـاري</text>
  <text x="256" y="405" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#34d399" letter-spacing="3" text-anchor="middle">EXCHANGE ERP</text>
</svg>
